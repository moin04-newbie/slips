import java.awt.*;
import java.awt.event.*;

public class ScrollText extends Frame implements Runnable {
    String text = "Welcome To Java Programming   ";
    int x = 0;
    boolean left = true;

    public ScrollText() {
        setSize(400, 200);
        setVisible(true);

        Thread t = new Thread(this);
        t.start();

        addWindowListener(new WindowAdapter() {
            public void windowClosing(WindowEvent e) {
                dispose();
            }
        });
    }

    public void paint(Graphics g) {
        g.drawString(text, x, 100);
    }

    public void run() {
        while (true) {
            if (left) {
                x += 5;
                if (x > 250) left = false;
            } else {
                x -= 5;
                if (x < 0) left = true;
            }

            repaint();

            try {
                Thread.sleep(100);
            } catch (Exception e) {}
        }
    }

    public static void main(String[] args) {
        new ScrollText();
    }
}

#### **A) Write a socket program in Java to check whether given number is prime or not. Display result on client terminal.**

**Server.java**

```java
import java.net.*;
import java.io.*;

public class Server {
    public static void main(String[] args) throws Exception {
        ServerSocket ss = new ServerSocket(1234);
        Socket s = ss.accept();

        DataInputStream dis = new DataInputStream(s.getInputStream());
        DataOutputStream dos = new DataOutputStream(s.getOutputStream());

        int num = dis.readInt();
        boolean isPrime = true;

        if(num <= 1) isPrime = false;
        else {
            for(int i=2; i<=Math.sqrt(num); i++){
                if(num % i == 0){
                    isPrime = false;
                    break;
                }
            }
        }

        if(isPrime)
            dos.writeUTF("Prime Number");
        else
            dos.writeUTF("Not Prime");

        dis.close();
        dos.close();
        s.close();
        ss.close();
    }
}
```

import java.applet.Applet;
import java.awt.*;
import java.util.Random;

public class BouncingBall extends Applet implements Runnable {
    int x = 50, y = 50, dx = 5, dy = 5;
    Thread t;
    Random r = new Random();
    Color ballColor = Color.RED;

    public void init() {
        t = new Thread(this);
        t.start();
    }

    public void run() {
        while(true){
            x += dx;
            y += dy;

            if(x < 0 || x > getWidth()-50){
                dx = -dx;
                ballColor = new Color(r.nextInt(255), r.nextInt(255), r.nextInt(255));
            }

            if(y < 0 || y > getHeight()-50){
                dy = -dy;
                ballColor = new Color(r.nextInt(255), r.nextInt(255), r.nextInt(255));
            }

            repaint();

            try { Thread.sleep(50); } catch(Exception e){}
        }
    }

    public void paint(Graphics g) {
        g.setColor(ballColor);
        g.fillOval(x, y, 50, 50);
    }
}

    public void doGet(HttpServletRequest req, HttpServletResponse res)
            throws ServletException, IOException {

        res.setContentType("text/html");
        PrintWriter out = res.getWriter();

        int count = 1;

        }
    }

public class ThreadLifecycle extends Thread {

        try {

        } catch (Exception e) {}
    }

        System.out.println("State: " + t.getState()); // NEW
        t.start();

        try {

            throws ServletException, IOException {

        res.setContentType("text/html");
        PrintWriter out = res.getWriter();

        String[] hobbies = req.getParameterValues("hobby");

        Cookie[] cookies = req.getCookies();

        for(String h : hobbies){

            boolean exists = false;

            if(cookies != null){
                for(Cookie c : cookies){
                    if(c.getName().equals(h)){
                        exists = true;
                        break;
                    }
                }
            }

            if(!exists){
                Cookie c = new Cookie(h, h);
                res.addCookie(c);
            }
        }

        out.println("<h3>Hobbies Stored Successfully</h3>");
    }
}
